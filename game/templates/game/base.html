{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Doctor Who quote game{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <link rel="stylesheet" href="{% static 'game/css/output.css' %}">
</head>
<body class="max-w-2xl mx-auto px-4 py-8">
{% block body %}{% endblock %}
<script>
document.body.addEventListener('click', function (ev) {
  var btn = ev.target.closest('.copy-share');
  if (!btn) return;
  var id = btn.getAttribute('data-copy-target');
  var el = id && document.getElementById(id);
  if (!el) return;
  el.select();
  el.setSelectionRange(0, 99999);
  navigator.clipboard.writeText(el.value);
});
</script>
</body>
</html>
