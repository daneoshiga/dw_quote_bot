<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Doctor Who quote game{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 42rem; margin: 2rem auto; padding: 0 1rem; line-height: 1.5; }
    .banner { padding: 0.75rem 1rem; border-radius: 0.5rem; margin-bottom: 1rem; }
    .banner.ok { background: #d4edda; color: #155724; }
    .banner.no { background: #f8d7da; color: #721c24; }
    blockquote { margin: 1rem 0; padding: 1rem; background: #f5f5f5; border-left: 4px solid #444; }
    fieldset { border: 1px solid #ccc; padding: 1rem; margin: 1rem 0; }
    label { display: block; margin: 0.35rem 0; cursor: pointer; }
  </style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
